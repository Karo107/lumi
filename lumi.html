<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lumi.</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --accent: #e8833a; }
  body {
    margin: 0; background: #121212; color: #f5f5f5;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    padding: 0 12px;
  }
  h1 { font-size: 16px; margin: 12px 0 8px; font-weight: 600; }
  #modes {
    display: flex; width: 100%; max-width: 520px; background: #1e1e1e;
    border-radius: 12px; padding: 4px; margin-bottom: 10px;
  }
  .mode {
    flex: 1; padding: 9px 0; border: 0; border-radius: 9px; background: transparent;
    color: #aaa; font-size: 14px; cursor: pointer;
  }
  .mode.on { background: var(--accent); color: #fff; font-weight: 600; }
  #wrap { position: relative; width: 100%; max-width: 520px; }
  #view { width: 100%; display: block; background: #000; border-radius: 12px; }
  #hold {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 15px; background: rgba(0,0,0,.35); border-radius: 12px;
  }
  #presets {
    display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 520px; padding: 12px 0 4px;
  }
  .chip {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid #444;
    background: #222; color: #eee; font-size: 14px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #sliders { width: 100%; max-width: 520px; padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
  .row label { width: 92px; color: #bbb; }
  .row input { flex: 1; accent-color: var(--accent); }
  #actions { display: flex; gap: 14px; margin: 14px 0 10px; align-items: center; }
  #shutter {
    width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff;
    background: var(--accent); cursor: pointer;
  }
  #shutter:active { transform: scale(0.94); }
  .sub {
    padding: 10px 14px; border-radius: 10px; border: 1px solid #444;
    background: #222; color: #eee; font-size: 14px; cursor: pointer;
  }
  .sub:disabled { opacity: .4; }
  #msg { color: #aaa; font-size: 13px; min-height: 18px; text-align: center; }
  .note { color: #777; font-size: 12px; max-width: 520px; line-height: 1.6; margin: 6px 0 24px; }
</style>
</head>
<body>

<h1>Lumi.</h1>

<div id="modes">
  <button class="mode on" data-mode="food">料理</button>
  <button class="mode" data-mode="beauty">美肌</button>
  <button class="mode" data-mode="night">夜景</button>
  <button class="mode" data-mode="goods">雑貨</button>
</div>

<div id="wrap">
  <canvas id="view"></canvas>
  <div id="hold">そのまま動かさないで…</div>
</div>

<div id="presets"></div>
<div id="sliders"></div>

<div id="actions">
  <button class="sub" id="switchCam">カメラ切替</button>
  <button id="shutter" aria-label="撮影"></button>
  <button class="sub" id="saveLast" disabled>再保存</button>
</div>

<div id="msg"></div>
<p class="note" id="note"></p>

<video id="cam" playsinline muted autoplay style="display:none"></video>

<script>
// ===== 設定 =====
const DEF = { warm: 0, bright: 1, sat: 1, contrast: 1, glow: 0, vig: 0,
              smooth: 0, spot: 0, pink: 0, shadow: 0, denoise: 0,
              fade: 0, grain: 0, cool: 0 };

const MODES = {
  food: {
    color: '#e8833a',
    note: '料理の色を温かく鮮やかに見せます。',
    presets: {
      'おいしそう': { warm: .2,  bright: 1.05, sat: 1.25, contrast: 1.08, vig: .2 },
      'ふんわり':   { warm: .1,  bright: 1.12, sat: 1.1,  contrast: .92, glow: .35, vig: .1 },
      'レトロ食堂': { warm: .35, bright: 1,    sat: .85, contrast: 1.1, vig: .4 },
      'すっきり':   { bright: 1.08, sat: 1.15, contrast: 1.15 },
      'そのまま':   {}
    },
    sliders: ['warm', 'bright', 'sat', 'glow', 'vig']
  },
  beauty: {
    color: '#d98a8a',
    note: '肌の色の範囲だけをなめらかにし、しみ・そばかすのような小さな暗い点を薄くします。くま（目の下の位置を見分ける処理）はまだ対象外です。',
    presets: {
      '自然':       { smooth: .4,  spot: .5, bright: 1.05, pink: .15 },
      'ふんわり':   { smooth: .65, spot: .6, bright: 1.1,  pink: .25, glow: .15 },
      'くっきり美肌': { smooth: .3, spot: .9, bright: 1.08, pink: .1, contrast: 1.05 }
    },
    sliders: ['smooth', 'spot', 'bright', 'pink']
  },
  night: {
    color: '#5b7bd5',
    note: '暗い部分を持ち上げ、数フレームを重ねてざらつきを減らします。撮影時は約1秒スマホを動かさないでください。動く被写体はぶれやすくなります。',
    presets: {
      '夜景':       { shadow: .6, denoise: .7, bright: 1.05, sat: 1.15, contrast: 1.05 },
      '夜の料理':   { shadow: .5, denoise: .6, bright: 1.05, warm: .2, sat: 1.2 },
      '夜の人物':   { shadow: .5, denoise: .6, bright: 1.05, smooth: .4, spot: .4, pink: .1 },
      'ネオン':     { shadow: .4, denoise: .6, sat: 1.5, contrast: 1.15, glow: .25, vig: .2 }
    },
    sliders: ['shadow', 'denoise', 'bright', 'warm', 'sat', 'smooth']
  },
  goods: {
    color: '#8c9a7e',
    note: '雑貨や小物をおしゃれに撮るフィルターです。白い壁や木の机の上で、窓からの自然光で撮ると雰囲気が出やすくなります。',
    presets: {
      'カフェ':     { warm: .25, bright: 1.06, sat: .85, contrast: .95, fade: .35, vig: .15 },
      '北欧':       { cool: .3, bright: 1.14, sat: .8, contrast: .9, fade: .25 },
      'フィルム':   { warm: .15, bright: 1.02, sat: .9, contrast: 1.05, fade: .4, grain: .35, vig: .25 },
      'くすみ':     { warm: .05, bright: 1.08, sat: .6, contrast: .88, fade: .45, glow: .1 },
      'モノトーン': { bright: 1.05, sat: 0, contrast: 1.12, fade: .2, grain: .2, vig: .2 }
    },
    sliders: ['bright', 'warm', 'cool', 'sat', 'fade', 'grain', 'vig']
  }
};

const SLIDER_DEF = {
  warm:    ['温かみ', -1, 1],
  bright:  ['明るさ', .6, 1.5],
  sat:     ['鮮やかさ', 0, 2],
  glow:    ['ふんわり光', 0, .6],
  vig:     ['周りの暗さ', 0, .6],
  smooth:  ['肌なめらか', 0, .9],
  spot:    ['しみ・そばかす', 0, 1],
  pink:    ['血色', 0, .6],
  shadow:  ['暗部の明るさ', 0, 1],
  denoise: ['ざらつき軽減', 0, .85],
  fade:    ['くすみ感', 0, .7],
  grain:   ['フィルムの粒', 0, .7],
  cool:    ['青み', 0, .8]
};

// ===== 要素 =====
const $ = id => document.getElementById(id);
const video = $('cam');
const view = $('view');
const vctx = view.getContext('2d', { willReadFrequently: true });
const small = document.createElement('canvas');
const sctx = small.getContext('2d');
const base = document.createElement('canvas');
const bctx = base.getContext('2d', { willReadFrequently: true });

let mode = 'food';
let cur = { ...DEF };
let facing = 'environment';
let stream = null;
let lastBlob = null;
let acc = null;           // フレーム重ね合わせ用
let boost = false;        // 夜景撮影中
let lut = new Uint8ClampedArray(256);
let lutShadow = -1;

// ===== カメラ =====
async function startCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    fitCanvas();
    $('msg').textContent = '';
  } catch (e) {
    $('msg').textContent = 'カメラを使えませんでした。許可設定とHTTPSでの表示を確認してください。';
  }
}

function fitCanvas() {
  const scale = Math.min(1, 720 / video.videoWidth);
  view.width = Math.round(video.videoWidth * scale);
  view.height = Math.round(video.videoHeight * scale);
  base.width = view.width; base.height = view.height;
  small.width = Math.max(1, Math.round(view.width / 10));
  small.height = Math.max(1, Math.round(view.height / 10));
  acc = null;
}

// ===== 補助 =====
function isSkin(r, g, b) {
  const Y  = 0.299 * r + 0.587 * g + 0.114 * b;
  const Cb = 128 - 0.1687 * r - 0.3313 * g + 0.5 * b;
  const Cr = 128 + 0.5 * r - 0.4187 * g - 0.0813 * b;
  return Y > 30 && Cb >= 77 && Cb <= 127 && Cr >= 133 && Cr <= 173;
}

function buildLut(shadow) {
  const gamma = 1 / (1 + shadow * 1.6);
  for (let v = 0; v < 256; v++) lut[v] = 255 * Math.pow(v / 255, gamma);
  lutShadow = shadow;
}

// ===== 描画 =====
function render() {
  if (video.readyState >= 2 && view.width > 0) {
    const w = view.width, h = view.height;
    vctx.drawImage(video, 0, 0, w, h);
    const img = vctx.getImageData(0, 0, w, h);
    const d = img.data;

    // ざらつき軽減：フレームを重ねて平均化
    if (cur.denoise > 0) {
      if (!acc || acc.length !== d.length) {
        acc = new Float32Array(d.length);
        for (let i = 0; i < d.length; i++) acc[i] = d[i];
      }
      let a = 1 - cur.denoise;
      if (boost) a = Math.min(a, 0.06);
      for (let i = 0; i < d.length; i += 4) {
        acc[i]     += (d[i]     - acc[i])     * a;
        acc[i + 1] += (d[i + 1] - acc[i + 1]) * a;
        acc[i + 2] += (d[i + 2] - acc[i + 2]) * a;
        d[i] = acc[i]; d[i + 1] = acc[i + 1]; d[i + 2] = acc[i + 2];
      }
    } else {
      acc = null;
    }

    // ぼかした下地（美肌・光用）
    sctx.drawImage(view, 0, 0, small.width, small.height);
    const needBase = cur.smooth > 0 || cur.spot > 0;
    let sm = null;
    if (needBase) {
      // 重ね合わせ後の映像から下地を作る
      bctx.putImageData(img, 0, 0);
      sctx.drawImage(base, 0, 0, small.width, small.height);
      bctx.drawImage(small, 0, 0, w, h);
      sm = bctx.getImageData(0, 0, w, h).data;
    }

    if (cur.shadow !== lutShadow) buildLut(cur.shadow);
    const { warm, bright, sat, contrast, smooth, spot, pink, shadow, fade, grain, cool } = cur;
    const lift = fade * 45, keep = 1 - fade * 0.3;
    const beauty = needBase || pink > 0;

    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];

      // 美肌
      if (beauty && isSkin(r, g, b)) {
        if (sm) {
          const sr = sm[i], sg = sm[i + 1], sb = sm[i + 2];
          const dl = (sr + sg + sb - r - g - b) / 3;
          if (dl > 6 && spot > 0) {
            const k = spot * Math.min(1, (dl - 6) / 25);
            r += (sr - r) * k; g += (sg - g) * k; b += (sb - b) * k;
          }
          r += (sr - r) * smooth; g += (sg - g) * smooth; b += (sb - b) * smooth;
        }
        r += pink * 25; g -= pink * 6;
      }

      // 暗部を持ち上げる
      if (shadow > 0) {
        r = lut[r < 0 ? 0 : r > 255 ? 255 : r | 0];
        g = lut[g < 0 ? 0 : g > 255 ? 255 : g | 0];
        b = lut[b < 0 ? 0 : b > 255 ? 255 : b | 0];
      }

      // 明るさ・温かみ
      r = r * bright + warm * 40;
      g = g * bright;
      b = b * bright - warm * 30;

      // 鮮やかさ
      const gray = 0.3 * r + 0.59 * g + 0.11 * b;
      r = gray + (r - gray) * sat;
      g = gray + (g - gray) * sat;
      b = gray + (b - gray) * sat;

      // コントラスト
      r = (r - 128) * contrast + 128;
      g = (g - 128) * contrast + 128;
      b = (b - 128) * contrast + 128;

      // 青み（雑貨の北欧風など）
      if (cool > 0) { r -= cool * 18; g += cool * 4; b += cool * 22; }

      // くすみ感：黒を持ち上げ、白を少し抑えてマットに
      if (fade > 0) {
        r = lift + r * keep;
        g = lift + g * keep;
        b = lift + b * keep;
      }

      // フィルムの粒
      if (grain > 0) {
        const n = (Math.random() - 0.5) * grain * 50;
        r += n; g += n; b += n;
      }

      d[i]     = r < 0 ? 0 : r > 255 ? 255 : r;
      d[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
    }
    vctx.putImageData(img, 0, 0);

    // ふんわり光
    if (cur.glow > 0) {
      sctx.drawImage(view, 0, 0, small.width, small.height);
      vctx.save();
      vctx.globalCompositeOperation = 'screen';
      vctx.globalAlpha = cur.glow;
      vctx.drawImage(small, 0, 0, w, h);
      vctx.restore();
    }

    // 周りの暗さ
    if (cur.vig > 0) {
      const grad = vctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3,
                                             w / 2, h / 2, Math.max(w, h) * 0.75);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(0,0,0,${cur.vig})`);
      vctx.fillStyle = grad;
      vctx.fillRect(0, 0, w, h);
    }
  }
  requestAnimationFrame(render);
}

// ===== UI =====
function applyPreset(name) {
  cur = { ...DEF, ...MODES[mode].presets[name] };
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.name === name));
  buildSliders();
}

function buildPresets() {
  const box = $('presets');
  box.innerHTML = '';
  Object.keys(MODES[mode].presets).forEach(name => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = name;
    b.dataset.name = name;
    b.onclick = () => applyPreset(name);
    box.appendChild(b);
  });
}

function buildSliders() {
  const box = $('sliders');
  box.innerHTML = '';
  MODES[mode].sliders.forEach(key => {
    const [label, min, max] = SLIDER_DEF[key];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="0.01" value="${cur[key]}">`;
    row.querySelector('input').oninput = e => { cur[key] = parseFloat(e.target.value); };
    box.appendChild(row);
  });
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.documentElement.style.setProperty('--accent', MODES[m].color);
  $('note').textContent = MODES[m].note;
  buildPresets();
  applyPreset(Object.keys(MODES[m].presets)[0]);
  acc = null;
}

document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));

// ===== 撮影 =====
function save() {
  view.toBlob(blob => {
    lastBlob = blob;
    $('saveLast').disabled = false;
    downloadBlob(blob);
    $('msg').textContent = '撮影しました（保存しました）';
  }, 'image/jpeg', 0.92);
}

$('shutter').onclick = () => {
  if (cur.denoise > 0) {
    // 夜景：約1秒かけてフレームを重ねてから保存
    boost = true;
    $('hold').style.display = 'flex';
    setTimeout(() => {
      save();
      boost = false;
      $('hold').style.display = 'none';
    }, 1200);
  } else {
    save();
  }
};

$('saveLast').onclick = () => { if (lastBlob) downloadBlob(lastBlob); };

function downloadBlob(blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lumi_${mode}_${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$('switchCam').onclick = () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  startCamera();
};

// ===== 起動 =====
setMode('food');
startCamera();
requestAnimationFrame(render);
</script>
</body>
</html>
