<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf7f3">
<title>Lumi.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  :root {
    --accent: #e8a7ad;
    --bg: #fbf7f3; --card: #fff; --ink: #5c4b47; --muted: #a8948e; --line: #f1e6e0;
    --shadow: 0 6px 18px rgba(120, 80, 70, .10);
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow: hidden;
  }
  #app { width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 100%; }

  /* ---- ロゴ ---- */
  #top { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 20px 6px; }
  #logo {
    font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif; font-style: italic;
    font-size: 30px; letter-spacing: .02em; color: var(--ink); line-height: 1;
  }
  #logo i { font-style: normal; color: var(--accent); font-size: 14px; vertical-align: top; margin-left: 2px; }
  #tag { font-size: 11px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }

  /* ---- ビューファインダー ---- */
  #vf {
    position: relative; margin: 0 12px; border-radius: 22px; overflow: hidden;
    background: #efe6e0; box-shadow: var(--shadow); flex: 0 0 auto;
  }
  #view { width: 100%; display: block; background: #efe6e0; }
  #modes {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 4px; border-radius: 999px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(10px); box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .mode {
    padding: 7px 13px; border: 0; border-radius: 999px; background: transparent;
    color: #7a6660; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .mode.on { background: var(--accent); color: #fff; font-weight: 600; }
  #fname {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.8); color: var(--ink);
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #fname.show { opacity: 1; }
  #hold {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; background: rgba(0,0,0,.35);
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
  #err {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; font-size: 14px; line-height: 1.7; color: var(--ink);
  }

  /* ---- フィルター ---- */
  #panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #filters {
    display: flex; gap: 12px; overflow-x: auto; padding: 14px 16px 4px;
    scrollbar-width: none; flex: 0 0 auto;
  }
  #filters::-webkit-scrollbar { display: none; }
  .f { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .f canvas {
    width: 58px; height: 74px; border-radius: 16px; background: #efe6e0;
    border: 2.5px solid #fff; box-shadow: 0 3px 10px rgba(120,80,70,.12); transition: transform .15s;
  }
  .f.on canvas { border-color: var(--accent); transform: translateY(-2px); }
  .f span { font-size: 11px; color: var(--muted); }
  .f.on span { color: var(--ink); font-weight: 600; }

  #strengthRow { display: flex; align-items: center; gap: 10px; padding: 8px 22px 0; font-size: 12px; color: var(--muted); }
  #strengthRow input { flex: 1; accent-color: var(--accent); }
  #strengthVal { width: 36px; text-align: right; color: var(--ink); }

  /* ---- 操作 ---- */
  #bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 34px 6px; flex: 0 0 auto; }
  #last {
    width: 48px; height: 48px; border-radius: 14px; background: #fff; border: 2px solid #fff;
    box-shadow: var(--shadow); overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  #last img { width: 100%; height: 100%; object-fit: cover; }
  #shutter {
    width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--accent);
    background: #fff; position: relative; cursor: pointer; box-shadow: 0 8px 22px rgba(232,167,173,.45);
  }
  #shutter::after {
    content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--accent);
    transition: inset .1s;
  }
  #shutter:active::after { inset: 10px; }
  .round {
    width: 48px; height: 48px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow);
    color: var(--ink); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  #adjToggle {
    align-self: center; background: none; border: 0; color: var(--muted); font-size: 12px;
    letter-spacing: .08em; padding: 4px 10px 10px; cursor: pointer;
  }
  #adjust { display: none; margin: 0 12px 12px; padding: 10px 16px 14px; overflow-y: auto;
            background: #fff; border-radius: 18px; box-shadow: var(--shadow); }
  #adjust.open { display: block; }
  .row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 12px; }
  .row label { width: 98px; color: var(--muted); white-space: nowrap; }
  .row input { flex: 1; accent-color: var(--accent); }
  #reset { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="app">

  <div id="top">
    <div id="logo">Lumi.<i>✧</i></div>
    <div id="tag">film · skin · night</div>
  </div>

  <div id="vf">
    <canvas id="view"></canvas>
    <div id="modes">
      <button class="mode on" data-mode="food">料理</button>
      <button class="mode" data-mode="beauty">美肌</button>
      <button class="mode" data-mode="night">夜景</button>
      <button class="mode" data-mode="goods">雑貨</button>
    </div>
    <div id="fname"></div>
    <div id="hold">そのまま動かさないで…</div>
    <div id="flash"></div>
    <div id="err"></div>
  </div>

  <div id="panel">
    <div id="filters"></div>
    <div id="strengthRow">
      <span>強さ</span>
      <input id="strength" type="range" min="0" max="100" step="1" value="100">
      <span id="strengthVal">100%</span>
    </div>
    <div id="bar">
      <div id="last"></div>
      <button id="shutter" aria-label="撮影"></button>
      <button class="round" id="flip" aria-label="カメラ切替">⟲</button>
    </div>
    <button id="adjToggle">細かく調整 ▾</button>
    <div id="adjust"></div>
  </div>

</div>

<video id="cam" playsinline muted autoplay style="display:none"></video>

<script>
// =====================================================================
//  設定
// =====================================================================
const DEF = { warm: 0, cool: 0, bright: 1, sat: 1, contrast: 1, glow: 0, vig: 0,
              smooth: 0, spot: 0, circles: 0, pink: 0,
              shadow: 0, denoise: 0, fade: 0, grain: 0 };

const MODES = {
  food: {
    color: '#efb39c',
    presets: [
      ['おいしそう', { warm: .2,  bright: 1.05, sat: 1.25, contrast: 1.08, vig: .15 }],
      ['ジューシー', { warm: .3,  bright: 1.03, sat: 1.4,  contrast: 1.12, vig: .2 }],
      ['スイーツ',   { warm: .05, bright: 1.12, sat: 1.15, contrast: .95, glow: .2, fade: .1 }],
      ['透明感',     { cool: .2,  bright: 1.1,  sat: 1.15, contrast: 1.05 }],
      ['カフェ',     { warm: .25, bright: 1.04, sat: .95,  contrast: 1,    fade: .25, vig: .25 }],
      ['居酒屋',     { warm: .35, bright: 1,    sat: 1.1,  contrast: 1.15, vig: .4, shadow: .2 }],
      ['そのまま',   {}]
    ],
    sliders: ['warm', 'bright', 'sat', 'contrast', 'glow', 'vig']
  },
  beauty: {
    color: '#e8a7ad',
    presets: [
      ['ナチュラル', { smooth: .5,  spot: .6, circles: .4, bright: 1.04, pink: .1 }],
      ['つや肌',     { smooth: .6,  spot: .7, circles: .5, bright: 1.08, pink: .15, glow: .12 }],
      ['色白',       { smooth: .55, spot: .7, circles: .5, bright: 1.12, cool: .15, sat: .9 }],
      ['血色',       { smooth: .5,  spot: .6, circles: .4, bright: 1.05, pink: .3, warm: .1 }],
      ['しっかり',   { smooth: .8,  spot: .9, circles: .7, bright: 1.06, pink: .1 }],
      ['そのまま',   {}]
    ],
    sliders: ['smooth', 'spot', 'circles', 'bright', 'pink']
  },
  night: {
    color: '#b3aee0',
    presets: [
      ['夜景',       { shadow: .6, denoise: .7, bright: 1.05, sat: 1.15, contrast: 1.05 }],
      ['夜の料理',   { shadow: .5, denoise: .6, bright: 1.05, warm: .2, sat: 1.2 }],
      ['夜の人物',   { shadow: .5, denoise: .6, bright: 1.05, smooth: .5, spot: .5, circles: .3, pink: .1 }],
      ['ネオン',     { shadow: .4, denoise: .6, sat: 1.5, contrast: 1.15, glow: .25, vig: .2 }],
      ['そのまま',   {}]
    ],
    sliders: ['shadow', 'denoise', 'bright', 'warm', 'sat']
  },
  goods: {
    color: '#b5c7ad',
    presets: [
      ['カフェ',     { warm: .25, bright: 1.06, sat: .85, contrast: .95, fade: .35, vig: .15 }],
      ['北欧',       { cool: .3,  bright: 1.14, sat: .8,  contrast: .9,  fade: .25 }],
      ['フィルム',   { warm: .15, bright: 1.02, sat: .9,  contrast: 1.05, fade: .4, grain: .35, vig: .25 }],
      ['くすみ',     { warm: .05, bright: 1.08, sat: .6,  contrast: .88, fade: .45, glow: .1 }],
      ['モノトーン', { bright: 1.05, sat: 0, contrast: 1.12, fade: .2, grain: .2, vig: .2 }],
      ['そのまま',   {}]
    ],
    sliders: ['bright', 'warm', 'cool', 'sat', 'fade', 'grain', 'vig']
  }
};

const SLIDER_DEF = {
  warm:     ['温かみ', -1, 1],
  cool:     ['青み', 0, .8],
  bright:   ['明るさ', .6, 1.5],
  sat:      ['鮮やかさ', 0, 2],
  contrast: ['コントラスト', .7, 1.4],
  glow:     ['ふんわり光', 0, .6],
  vig:      ['周りの暗さ', 0, .6],
  smooth:   ['なめらか', 0, 1],
  spot:     ['しみ・そばかす', 0, 1],
  circles:  ['くま', 0, 1],
  pink:     ['血色', 0, .6],
  shadow:   ['暗部の明るさ', 0, 1],
  denoise:  ['ざらつき軽減', 0, .85],
  fade:     ['くすみ感', 0, .7],
  grain:    ['フィルムの粒', 0, .7]
};

// =====================================================================
//  状態
// =====================================================================
const $ = id => document.getElementById(id);
const video = $('cam');
const view = $('view');
const vctx = view.getContext('2d', { willReadFrequently: true });

let mode = 'food';
let fIndex = 0;
let base = { ...DEF };       // 選択中フィルター（調整込み）
let strength = 1;
let cur = { ...DEF };        // base と DEF を強さで混ぜたもの
let facing = 'environment';
let stream = null;
let lastBlob = null;
let boost = false;
let acc = null;              // 夜景のフレーム重ね合わせ
let lut = new Uint8ClampedArray(256), lutShadow = -1;
const tmpCache = {};         // サイズごとの作業用キャンバス

function mix() {
  cur = {};
  for (const k in DEF) cur[k] = DEF[k] + (base[k] - DEF[k]) * strength;
}

// =====================================================================
//  カメラ
// =====================================================================
async function startCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    fitCanvas();
    $('err').style.display = 'none';
  } catch (e) {
    $('err').style.display = 'flex';
    $('err').textContent = 'カメラを使えませんでした。ブラウザのカメラ許可をオンにして、ページを開き直してください。';
  }
}

function fitCanvas() {
  const scale = Math.min(1, 540 / video.videoWidth);
  view.width = Math.round(video.videoWidth * scale);
  view.height = Math.round(video.videoHeight * scale);
  acc = null;
}

function tmpFor(w, h) {
  const key = w + 'x' + h;
  if (!tmpCache[key]) {
    const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h;
                       return { c, ctx: c.getContext('2d', { willReadFrequently: true }) }; };
    tmpCache[key] = { base: mk(), a: mk(), b: mk(), c: mk() };
  }
  return tmpCache[key];
}

// =====================================================================
//  補助
// =====================================================================
function buildLut(shadow) {
  const gamma = 1 / (1 + shadow * 1.6);
  for (let v = 0; v < 256; v++) lut[v] = 255 * Math.pow(v / 255, gamma);
  lutShadow = shadow;
}

// 肌の色らしさ 0〜1（境界をなだらかに）
function skinMask(r, g, b) {
  const Y  = 0.299 * r + 0.587 * g + 0.114 * b;
  if (Y < 30) return 0;
  const Cb = 128 - 0.1687 * r - 0.3313 * g + 0.5 * b;
  const Cr = 128 + 0.5 * r - 0.4187 * g - 0.0813 * b;
  const f = 8;
  let mb = Math.min(Cb - (77 - f), (127 + f) - Cb) / (2 * f);
  let mr = Math.min(Cr - (133 - f), (173 + f) - Cr) / (2 * f);
  if (mb <= 0 || mr <= 0) return 0;
  return Math.min(1, mb) * Math.min(1, mr);
}

// =====================================================================
//  画像処理（プレビュー・サムネイル・保存で共通）
//  src: video など  ctx: 出力先  p: パラメータ  opt: { mirror, denoise(acc) }
// =====================================================================
function process(src, ctx, w, h, p, opt = {}) {
  ctx.filter = 'none';
  ctx.save();
  if (opt.mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, 0, 0, w, h);
  ctx.restore();

  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;

  // --- ざらつき軽減（フレームの重ね合わせ） ---
  if (p.denoise > 0 && opt.useAcc) {
    if (!acc || acc.length !== d.length) {
      acc = new Float32Array(d.length);
      for (let i = 0; i < d.length; i++) acc[i] = d[i];
    }
    let a = 1 - p.denoise;
    if (boost) a = Math.min(a, 0.06);
    for (let i = 0; i < d.length; i += 4) {
      acc[i]     += (d[i]     - acc[i])     * a;
      acc[i + 1] += (d[i + 1] - acc[i + 1]) * a;
      acc[i + 2] += (d[i + 2] - acc[i + 2]) * a;
      d[i] = acc[i]; d[i + 1] = acc[i + 1]; d[i + 2] = acc[i + 2];
    }
  } else if (opt.useAcc) {
    acc = null;
  }

  // --- 美肌用のぼかし画像（細かい肌用 A と、くま用の大きめ B） ---
  const beauty = p.smooth > 0 || p.spot > 0 || p.circles > 0 || p.pink > 0;
  let A = null, B = null, C = null;
  const tmp = tmpFor(w, h);
  if (beauty) {
    tmp.base.ctx.putImageData(img, 0, 0);
    tmp.a.ctx.filter = `blur(${(w / 110).toFixed(1)}px)`;
    tmp.a.ctx.drawImage(tmp.base.c, 0, 0);
    A = tmp.a.ctx.getImageData(0, 0, w, h).data;
    if (p.spot > 0) {
      tmp.b.ctx.filter = `blur(${(w / 32).toFixed(1)}px)`;
      tmp.b.ctx.drawImage(tmp.base.c, 0, 0);
      B = tmp.b.ctx.getImageData(0, 0, w, h).data;
    }
    if (p.circles > 0) {
      tmp.c.ctx.filter = `blur(${(w / 8).toFixed(1)}px)`;
      tmp.c.ctx.drawImage(tmp.base.c, 0, 0);
      C = tmp.c.ctx.getImageData(0, 0, w, h).data;
    }
  }

  if (p.shadow !== lutShadow) buildLut(p.shadow);
  const { warm, cool, bright, sat, contrast, smooth, spot, circles, pink, shadow, fade, grain } = p;
  const lift = fade * 45, keep = 1 - fade * 0.3;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];

    // ---- 美肌（肌色の部分だけ、輪郭は残す） ----
    if (beauty) {
      const m = skinMask(r, g, b);
      if (m > 0) {
        const lo = 0.299 * r + 0.587 * g + 0.114 * b;
        if (A) {
          const ar = A[i], ag = A[i + 1], ab = A[i + 2];
          const la = 0.299 * ar + 0.587 * ag + 0.114 * ab;
          const diff = lo - la;              // 周りより明るければ＋、暗ければ−
          const ad = diff < 0 ? -diff : diff;
          if (ad < 40) {                     // 大きな差＝輪郭なので触らない
            const k = smooth * (1 - ad / 40) * m;   // 細かい凹凸をならす
            if (k > 0) { r += (ar - r) * k; g += (ag - g) * k; b += (ab - b) * k; }
          }
        }
        if (B) {                           // 周囲よりはっきり暗い点＝しみ・そばかす
          const br = B[i], bg = B[i + 1], bb = B[i + 2];
          const d2 = lo - (0.299 * br + 0.587 * bg + 0.114 * bb);
          if (d2 < -8 && d2 > -75) {
            const ks = spot * Math.min(1, (-d2 - 8) / 20) * m;
            r += (br - r) * ks; g += (bg - g) * ks; b += (bb - b) * ks;
          }
        }
        if (C) {                           // 顔全体の明るさよりうっすら暗い広い範囲＝くま・影
          const cr = C[i], cg = C[i + 1], cb = C[i + 2];
          const d3 = lo - (0.299 * cr + 0.587 * cg + 0.114 * cb);
          if (d3 < -6 && d3 > -55) {
            const kc = circles * Math.min(1, (-d3 - 6) / 12) * m;
            r += (cr - r) * kc; g += (cg - g) * kc; b += (cb - b) * kc;
          }
        }
        r += pink * 25 * m; g -= pink * 6 * m;
      }
    }

    // ---- 暗部を持ち上げる ----
    if (shadow > 0) {
      r = lut[r < 0 ? 0 : r > 255 ? 255 : r | 0];
      g = lut[g < 0 ? 0 : g > 255 ? 255 : g | 0];
      b = lut[b < 0 ? 0 : b > 255 ? 255 : b | 0];
    }

    // ---- 明るさ・色味 ----
    r = r * bright + warm * 40 - cool * 18;
    g = g * bright + cool * 4;
    b = b * bright - warm * 30 + cool * 22;

    const gray = 0.3 * r + 0.59 * g + 0.11 * b;
    r = gray + (r - gray) * sat;
    g = gray + (g - gray) * sat;
    b = gray + (b - gray) * sat;

    r = (r - 128) * contrast + 128;
    g = (g - 128) * contrast + 128;
    b = (b - 128) * contrast + 128;

    if (fade > 0) { r = lift + r * keep; g = lift + g * keep; b = lift + b * keep; }
    if (grain > 0) { const n = (Math.random() - 0.5) * grain * 50; r += n; g += n; b += n; }

    d[i]     = r < 0 ? 0 : r > 255 ? 255 : r;
    d[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
    d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
  }
  ctx.putImageData(img, 0, 0);

  // ---- ふんわり光 ----
  if (p.glow > 0) {
    tmp.a.ctx.filter = `blur(${(w / 50).toFixed(1)}px)`;
    tmp.a.ctx.drawImage(ctx.canvas, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = p.glow;
    ctx.drawImage(tmp.a.c, 0, 0);
    ctx.restore();
  }

  // ---- 周りの暗さ ----
  if (p.vig > 0) {
    const grad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${p.vig})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
}

// =====================================================================
//  プレビュー描画
// =====================================================================
function render() {
  if (video.readyState >= 2 && view.width > 0) {
    process(video, vctx, view.width, view.height, cur, { mirror: facing === 'user', useAcc: true });
  }
  requestAnimationFrame(render);
}

// =====================================================================
//  フィルター一覧（小さなプレビュー付き）
// =====================================================================
const TW = 58 * 2, TH = 74 * 2;
let thumbEls = [];

function buildFilters() {
  const box = $('filters');
  box.innerHTML = '';
  thumbEls = [];
  MODES[mode].presets.forEach(([name], i) => {
    const el = document.createElement('div');
    el.className = 'f' + (i === fIndex ? ' on' : '');
    const c = document.createElement('canvas');
    c.width = TW; c.height = TH;
    const s = document.createElement('span');
    s.textContent = name;
    el.append(c, s);
    el.onclick = () => selectFilter(i);
    box.appendChild(el);
    thumbEls.push(c);
  });
  updateThumbs();
}

function updateThumbs() {
  if (video.readyState < 2) return;
  // 映像の中央を正方形に近い形で切り出して小さく描く
  const vw = video.videoWidth, vh = video.videoHeight;
  const srcAspect = vw / vh, dstAspect = TW / TH;
  let sw, sh, sx, sy;
  if (srcAspect > dstAspect) { sh = vh; sw = vh * dstAspect; sx = (vw - sw) / 2; sy = 0; }
  else { sw = vw; sh = vw / dstAspect; sx = 0; sy = (vh - sh) / 2; }
  const cropC = document.createElement('canvas'); cropC.width = TW; cropC.height = TH;
  const cc = cropC.getContext('2d');
  cc.save();
  if (facing === 'user') { cc.translate(TW, 0); cc.scale(-1, 1); }
  cc.drawImage(video, sx, sy, sw, sh, 0, 0, TW, TH);
  cc.restore();
  MODES[mode].presets.forEach(([, preset], i) => {
    const p = { ...DEF, ...preset };
    p.denoise = 0;
    const ctx = thumbEls[i].getContext('2d', { willReadFrequently: true });
    process(cropC, ctx, TW, TH, p, {});
  });
}
setInterval(updateThumbs, 1500);

function selectFilter(i) {
  fIndex = i;
  base = { ...DEF, ...MODES[mode].presets[i][1] };
  mix();
  thumbEls.forEach((c, j) => c.parentElement.classList.toggle('on', j === i));
  const el = $('filters').children[i];
  if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  showName(MODES[mode].presets[i][0]);
  buildAdjust();
}

let nameTimer = null;
function showName(t) {
  const el = $('fname');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => el.classList.remove('show'), 900);
}

// =====================================================================
//  モード・強さ・細かい調整
// =====================================================================
function setMode(m) {
  mode = m;
  fIndex = 0;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.documentElement.style.setProperty('--accent', MODES[m].color);
  acc = null;
  buildFilters();
  selectFilter(0);
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));

$('strength').oninput = e => {
  strength = e.target.value / 100;
  $('strengthVal').textContent = e.target.value + '%';
  mix();
};

$('adjToggle').onclick = () => {
  const open = $('adjust').classList.toggle('open');
  $('adjToggle').textContent = open ? '細かく調整 ▴' : '細かく調整 ▾';
};

function buildAdjust() {
  const box = $('adjust');
  box.innerHTML = '';
  MODES[mode].sliders.forEach(key => {
    const [label, min, max] = SLIDER_DEF[key];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="0.01" value="${base[key]}">`;
    row.querySelector('input').oninput = e => { base[key] = parseFloat(e.target.value); mix(); };
    box.appendChild(row);
  });
  const r = document.createElement('button');
  r.id = 'reset'; r.textContent = 'このフィルターの初期値に戻す';
  r.onclick = () => selectFilter(fIndex);
  box.appendChild(r);
}

// スワイプでフィルター切替
let touchX = null;
$('vf').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('vf').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  const n = MODES[mode].presets.length;
  if (dx < -50) selectFilter((fIndex + 1) % n);
  else if (dx > 50) selectFilter((fIndex - 1 + n) % n);
}, { passive: true });

// =====================================================================
//  撮影・保存
// =====================================================================
function capture() {
  let c;
  if (cur.denoise > 0) {
    c = view;                                   // 夜景は重ね合わせ済みのプレビューを使う
  } else {
    const W = video.videoWidth, H = video.videoHeight;   // それ以外はフル解像度で処理
    c = document.createElement('canvas'); c.width = W; c.height = H;
    process(video, c.getContext('2d', { willReadFrequently: true }), W, H, cur, { mirror: facing === 'user' });
  }
  c.toBlob(blob => {
    lastBlob = blob;
    const url = URL.createObjectURL(blob);
    $('last').innerHTML = `<img src="${url}" alt="">`;
    downloadBlob(blob, url);
  }, 'image/jpeg', 0.93);
}

$('shutter').onclick = () => {
  $('flash').style.opacity = .7;
  setTimeout(() => $('flash').style.opacity = 0, 120);
  if (cur.denoise > 0) {
    boost = true;
    $('hold').style.display = 'flex';
    setTimeout(() => { capture(); boost = false; $('hold').style.display = 'none'; }, 1200);
  } else {
    capture();
  }
};

$('last').onclick = () => { if (lastBlob) downloadBlob(lastBlob, URL.createObjectURL(lastBlob)); };

function downloadBlob(blob, url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = `lumi_${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

$('flip').onclick = () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  startCamera();
};

// =====================================================================
//  起動
// =====================================================================
setMode('food');
startCamera();
requestAnimationFrame(render);
</script>
</body>
</html>
